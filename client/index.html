<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6B3E2E" />
    <meta name="background-color" content="#ffffff" />
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Pathak Bhandar offers fresh artisan breads, cakes, pastries, and traditional sweets in Prayagraj. Order online for same-day delivery. Established taste, premium quality." />
    <meta name="keywords" content="bakery Prayagraj, cake shop Prayagraj, fresh bread, pastries, sweets, confectionery, Pathak Bhandar, order cake online" />
    <meta name="author" content="Pathak Bhandar" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pathak Bhandar - Premium Bakery & Confectionery | Prayagraj" />
    <meta property="og:description" content="Fresh artisan breads, cakes, pastries, and traditional sweets. Order online for same-day delivery in Prayagraj." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="Pathak Bhandar" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pathak Bhandar - Premium Bakery & Confectionery | Prayagraj" />
    <meta name="twitter:description" content="Fresh artisan breads, cakes, pastries, and traditional sweets. Order online for same-day delivery in Prayagraj." />
    <meta name="twitter:image" content="/logo.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pathak Bhandar" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="msapplication-TileColor" content="#8B4513" />
    <meta name="msapplication-navbutton-color" content="#8B4513" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Favicons and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48.png" />

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512.png" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="theme-color" content="#6B3E2E" />
    
    <title>Pathak Bhandar - Premium Bakery & Confectionery | Prayagraj</title>

    <!-- Fonts for About Us page -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "Pathak Bhandar",
      "description": "Premium bakery and confectionery offering fresh artisan breads, cakes, pastries, and traditional sweets in Prayagraj.",
      "url": "https://pathakbhandar.com",
      "logo": "https://pathakbhandar.com/logo.png",
      "image": "https://pathakbhandar.com/logo.png",
      "servesCuisine": ["Bakery", "Confectionery", "Indian Sweets"],
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Prayagraj",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
          "opens": "08:00",
          "closes": "21:00"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Bakery Products",
        "itemListElement": [
          {"@type": "OfferCatalog", "name": "Breads & Loaves"},
          {"@type": "OfferCatalog", "name": "Cakes & Pastries"},
          {"@type": "OfferCatalog", "name": "Traditional Sweets"},
          {"@type": "OfferCatalog", "name": "Cookies & Biscuits"}
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
